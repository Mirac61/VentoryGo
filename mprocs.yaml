# Getrennte, scrollbare Bereiche statt einer gemeinsamen Ausgabe. Wird von
# scripts/dev.sh und scripts/dev.ps1 benutzt, sobald mprocs installiert ist.
#
# Jeder Prozess läuft in einem Pseudo-Terminal, deshalb bleiben die Farben von Gin und
# Vite erhalten -- durch eine Pipe schalten beide sie ab.
#
# Die Tastenbelegung blendet mprocs selbst ein. Die Umgebung aus backend/.env hat das
# aufrufende Skript bereits gesetzt und wird vererbt.

procs:
  backend:
    shell: go run .
    cwd: backend

  frontend:
    shell: npm run dev
    cwd: frontend

  proxy:
    # Führt Landing Page (:4173) und Frontend (:5173) unter einem Origin (:8090)
    # zusammen. Die Landing Page starten die Dev-Skripte nicht mit -- sie läuft
    # separat in landing/ (pnpm dev).
    shell: node proxy.js
    cwd: dev-proxy

  docker:
    shell: docker stats
    # Läuft erst auf Zuruf: docker stats zeichnet sich sekündlich neu und hat im
    # Hintergrund keinen Nutzen.
    autostart: false
