name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan: catches newly disclosed CVEs in unchanged code
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-security:
    name: Go (govulncheck + gosec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Install scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Dependency vulnerabilities (govulncheck)
        run: govulncheck ./...

      - name: Static security analysis (gosec)
        run: gosec -quiet ./...

  trivy:
    name: Trivy (deps, secrets, config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
