# Projektname festgepinnt statt vom Ordnernamen abgeleitet: ein Rename des
# Ordners haengt Compose sonst an ein frisches, leeres Volume.
name: ventorygo

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # depends_on wartet sonst nur aufs Starten des Containers, nicht darauf,
      # dass Postgres wirklich Verbindungen annimmt.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Im Dev laeuft das Backend auf dem Host (`go run .`) gegen localhost:5432 --
  # kein Image-Rebuild pro Aenderung, Debugger haengt sich nativ dran.
  # Ganzen Stack in Docker: `docker compose --profile docker up -d`.
  backend:
    profiles: ["docker"]
    build: ./backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Gewinnt gegen env_file: im Container ist die DB nicht localhost, sondern
      # der Service-Name. Passwort kommt aus ../.env, nicht aus diesem File.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
