# Projektname festgepinnt statt vom Ordnernamen abgeleitet: ein Rename des
# Ordners haengt Compose sonst an ein frisches, leeres Volume.
name: ventorygo

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # depends_on wartet sonst nur aufs Starten des Containers, nicht darauf,
      # dass Postgres wirklich Verbindungen annimmt.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-Shot vor dem Backend: ohne Schema antwortet die API mit 500 statt zu scheitern.
  migrate:
    profiles: ["docker"]
    image: migrate/migrate:v4.19.1
    restart: "no"
    network_mode: "service:postgres"
    env_file:
      - backend/.env
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    # $$ verhindert, dass Compose die Variable selbst auflöst; die Shell im Container tut es.
    command: ['migrate -path=/migrations -database="$$DATABASE_URL" up']
    depends_on:
      postgres:
        condition: service_healthy

  # Im Dev laeuft das Backend auf dem Host (`go run .`) gegen localhost:5432 --
  # kein Image-Rebuild pro Aenderung, Debugger haengt sich nativ dran.
  # Ganzen Stack in Docker: `docker compose --profile docker up -d`.
  backend:
    profiles: ["docker"]
    build: ./backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Leer überschreibt die localhost-URL aus backend/.env; pgx fällt dann auf PG* zurück.
      DATABASE_URL: ""
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGSSLMODE: disable
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
